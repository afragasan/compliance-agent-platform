[project]
name = "compliance-agent-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alefrafty", email = "alejandro.fraga@affinity.network" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-aws>=0.2.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.2.3",
    "faiss-cpu>=1.9.0",
    "pgvector>=0.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.6",
    "testcontainers[postgres]>=4.8.0",
    "moto[s3]>=5.0.0",
]

[project.scripts]
compliance-agent-platform = "compliance_agent_platform:main"
cap = "compliance_agent_platform.runtime.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL (DATABASE_URL)",
]
