services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap
      POSTGRES_DB: cap
    ports:
      - "5432:5432"
    volumes:
      - cap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway database for `pytest -m integration` (TEST_DATABASE_URL). Kept separate from
  # `postgres`/the dev RDS because the suite TRUNCATEs audit + checkpoint tables.
  postgres_test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap
      POSTGRES_DB: cap_it
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap_it"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cap_pgdata:
